apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    example.entigo.io/variant: pull-request
spec:
  replicas: 3
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        image: {{ .Values.image.registry }}:{{ .Values.image.tag }}
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 1
          periodSeconds: 1
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          limits:
            cpu: 50m
            memory: 128Mi
            ephemeral-storage: 100Mi
          requests:
            cpu: 1m
            memory: 32Mi
            ephemeral-storage: 10Mi
        ports:
        - containerPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Policies address the pod's port, not the Service's. When the chart is
    # published through a route or an ingress the load balancer's addresses
    # are not pods, so any source is allowed; otherwise only the chart's own
    # pods may connect.
    - ports:
        - protocol: TCP
          port: 8080
      {{- if not (or .Values.httpRoute.enabled .Values.ingress.enabled) }}
      from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}
      {{- end }}

