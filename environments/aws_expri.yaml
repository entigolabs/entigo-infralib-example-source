# Agent configuration of the aws_expri environment: cloud aws, prefix expri, both
# from the file name. The framework runs the agent with a patched copy: this
# repository as first source, module names and the inputs of this
# repository's modules filled in, and in a pull request the module under test
# appended as a step of its own.
#
# This repository holds two hello-world modules; their inputs live in
# modules/*/hello-world/test/aws_expri.yaml. Everything else that makes a
# platform comes from the released entigo-infralib with its inputs inline,
# kept to what the example needs: the vpc calculates its subnets from the
# cidr, argocd and hello-world derive their hostnames from the route53 zone,
# aws-alb and external-dns need crossplane and crossplane-aws to function,
# external-dns watches Istio gateways so it needs istio-base's CRDs and the
# istio-system namespace that istio-istiod creates, and ecr-proxy caches the
# public registries because the VPC's S3 endpoint policy blocks the buckets
# registry.k8s.io redirects to. metrics-server feeds the autoscalers of
# istiod and argocd, without which ArgoCD rates them Degraded.
#
# Region comes from AWS_REGION, as for the agent. The environment lives in
# the entigo-infralib AWS test account next to its own biz and pri, so the
# prefix and the cidr are its own.
sources:
  - url: https://github.com/entigolabs/entigo-infralib-release
steps:
  - name: net
    type: terraform
    modules:
      - name: vpc
        source: aws/vpc
        inputs:
          vpc_cidr: "10.161.0.0/16"
      - name: route53
        source: aws-v2/route53
        inputs:
          domains: |
            {
              "expri" = {
                domain_name     = "{{ .config.prefix }}-{{ .step.name }}-{{ .module.name }}.infralib.entigo.io"
                parent_zone_id  = "Z07983041XRLSLZUTHHDY"
                default_private = true
                default_public  = true
              }
            }
      - name: ecr-proxy
        source: aws/ecr-proxy
      - name: hello-world
        source: aws/hello-world
  - name: infra
    type: terraform
    vpc:
      attach: true
    modules:
      - name: eks
        source: aws/eks
        inputs:
          eks_cluster_public: true
          # Cluster access for the CI identity (the github IAM user, as in
          # entigo-infralib) and for administrators logged in through SSO.
          # The identity that created the cluster has access by default.
          aws_auth_user: "github"
          iam_admin_role: "AWSReservedSSO_AdministratorAccess_.*"
          eks_main_min_size: 1
          eks_main_max_size: 3
          eks_main_capacity_type: "SPOT"
          eks_main_subnets: |
            ["{{ .toutput.vpc.private_subnets[0] }}"]
          eks_tools_min_size: 1
          eks_tools_max_size: 2
          eks_tools_capacity_type: "SPOT"
          eks_mon_capacity_type: "SPOT"
          eks_mon_subnets: |
            ["{{ .toutput.vpc.private_subnets[0] }}"]
          cluster_enabled_log_types: |
            []
      - name: crossplane
        source: aws/crossplane
  - name: apps
    type: argocd-apps
    argocd_namespace: argocd-expri
    modules:
      - name: argocd-expri
        source: argocd
        inputs:
          argocd:
            dex:
              enabled: false
            repoServer:
              autoscaling:
                maxReplicas: 1
            configs:
              params:
                server.dex.server: ""
      - name: metrics-server-expri
        source: metrics-server
      - name: crossplane-system
        source: crossplane-core
      - name: crossplane-aws
        source: crossplane-aws
        inputs:
          global:
            createObservers: true
            createNamespacedObservers: true
      - name: aws-alb-expri
        source: aws-alb
        inputs:
          ingressClass:
            service:
              enabled: false
          global:
            routingResources: "both"
            createIngress: false
            createRoute: true
            createType: route
            internalGateway: external
      - name: istio-base-expri
        source: istio-base
      - name: istio-system
        source: istio-istiod
      - name: external-dns-expri
        source: external-dns
        inputs:
          external-dns:
            extraArgs:
              - "--metrics-address=:7979"
              - "--zone-id-filter={{ .toutput.route53.pub_zone_id }}"
      - name: hello-world-expri
        source: hello-world
