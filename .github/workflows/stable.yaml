name: Stable

on:
  schedule:
    - cron: "31 3 * * 1-5"
  workflow_dispatch:

jobs:
  stable:
    uses: entigolabs/entigo-infralib-test/.github/workflows/module-stable.yaml@main
    with:
      # The repository under test is always consumed over git; the OCI
      # registries the release publishes to are for consumers.
      release_repo: https://github.com/entigolabs/entigo-infralib-example-release
    secrets: inherit
