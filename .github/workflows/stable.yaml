name: Stable

on:
  # No schedule for now: the environments are provisioned by hand. Without a
  # scheduled Stable the Release workflow also runs only when dispatched.
  workflow_dispatch:
    inputs:
      cloud:
        description: cloud to run; a dispatched run never triggers a release
        type: choice
        options: [all, aws, google, oracle, azure]
        default: all

jobs:
  stable:
    uses: entigolabs/entigo-infralib-test/.github/workflows/module-stable.yaml@main
    with:
      clouds: ${{ inputs.cloud || '' }}
      # The repository under test is always consumed over git; the OCI
      # registries the release publishes to are for consumers.
      release_repo: https://github.com/entigolabs/entigo-infralib-example-release
    secrets: inherit
